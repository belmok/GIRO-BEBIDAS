name: Publicar Giro Bebidas

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    if: github.repository == 'belmok/GIRO-BEBIDAS'
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - name: Obter código da versão
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar SDK definido no projeto
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Conferir tag e versão
        env:
          GIRO_TAG: ${{ github.ref_name }}
        run: |
          $taskVersion = ([xml][IO.File]::ReadAllText('Directory.Build.props')).Project.PropertyGroup.Version
          if ($taskVersion -notmatch '^\d+\.\d+\.\d+$' -or $env:GIRO_TAG -cne ('v' + $taskVersion)) {
            throw 'A tag deve corresponder à versão estável em Directory.Build.props, por exemplo v1.1.0.'
          }
          $taskSdk = ([IO.File]::ReadAllText('global.json') | ConvertFrom-Json).sdk.version
          if ($taskSdk -ne '8.0.425') { throw 'Atualize conscientemente o SDK e este workflow antes de publicar.' }

      - name: Compilar e executar verificações
        run: |
          dotnet build GiroBebidas.sln -c Release --nologo -m:1 -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw 'Falha de compilação.' }
          dotnet run --project tests/GiroBebidas.Tests/GiroBebidas.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Falha nas verificações.' }

      - name: Gerar instalador completo
        run: ./scripts/Gerar-Distribuicao.ps1 -SemTestes

      - name: Verificar pacote, telas, instalação e remoção
        run: ./scripts/Verificar-Distribuicao.ps1

      - name: Publicar somente após conferir todos os arquivos
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publicar-GitHub.ps1 -Repositorio 'belmok/GIRO-BEBIDAS' -Publicar

      - name: Guardar telas e resultado da verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-${{ github.ref_name }}
          path: artifacts/verificacao/
          if-no-files-found: ignore
          retention-days: 7
